<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Your Cart</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
  <div class="container">
    <h1>Your Cart</h1>
    <p th:if="${message}" class="message" th:text="${message}"></p>
    <p th:if="${error}" class="error" th:text="${error}"></p>
    <div th:if="${errors != null and !errors.isEmpty()}">
      <p class="error">Cannot place order:</p>
      <ul class="error-list">
        <li th:each="err : ${errors}" th:text="${err}"></li>
      </ul>
    </div>
    <div class="page-actions">
      <a th:href="@{/products}" class="btn btn-secondary">Continue shopping</a>
    </div>
    <div th:if="${cartEntries != null and !cartEntries.isEmpty()}">
      <form th:action="@{/cart/update}" method="post" class="cart-form">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="entry : ${cartEntries}">
                <td th:text="${entry.product.name}"></td>
                <td th:text="${entry.product.price}"></td>
                <td>
                  <input type="number" th:name="'qty_' + ${entry.product.id}" th:value="${entry.quantity}" th:max="${entry.product.quantity}" min="0" class="qty-input" title="Max: in stock"/>
                  <span class="stock-hint" th:if="${entry.atMax}">(max)</span>
                </td>
                <td th:text="${entry.lineTotal}"></td>
                <td>
                  <form th:action="@{/cart/remove/{id}(id=${entry.product.id})}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-small btn-danger">Remove</button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn">Update cart</button>
        </div>
      </form>
      <div class="cart-actions">
        <form th:action="@{/cart/place-order}" method="post" style="display: inline;">
          <button type="submit" class="btn">Place order</button>
        </form>
      </div>
    </div>
    <div th:if="${cartEntries == null or cartEntries.isEmpty()}" class="empty-cart">
      <p>Your cart is empty. <a th:href="@{/products}">Browse products</a> to add items.</p>
    </div>
  </div>
</body>
</html>
