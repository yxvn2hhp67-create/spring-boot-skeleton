<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>New Product</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
  <div class="container">
    <h1>New Product</h1>
    <form th:action="@{/products}" th:object="${product}" method="post">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}" required/>
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <input type="text" id="description" th:field="*{description}"/>
      </div>
      <div class="form-group">
        <label for="price">Price</label>
        <input type="number" id="price" th:field="*{price}" step="0.01" required/>
      </div>
      <div class="form-group" th:classappend="${#fields.hasErrors('quantity')} ? 'has-error' : ''">
        <label for="quantity">Stock quantity</label>
        <input type="number" id="quantity" th:field="*{quantity}" min="0" required/>
        <span class="field-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></span>
      </div>
      <div class="form-actions">
        <button type="submit">Create</button>
        <a th:href="@{/products}" class="btn btn-secondary">Back to products</a>
      </div>
    </form>
  </div>
</body>
</html>
